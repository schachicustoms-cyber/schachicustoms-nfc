<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCHACHICUSTOMS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>SCHACHICUSTOMS</h1>
    </header>

    <main class="card-page">

        <section class="card-container">

            <div class="card-image">
                <img id="card-image" src="" alt="Card">
            </div>

            <div class="card-info">

                <p class="card-label">SCHACHICUSTOMS NFC CARD</p>

                <h2 id="card-name">Loading...</h2>

                <p class="card-id">
                    Card ID: <span id="card-id">...</span>
                </p>

                <div class="card-data">

                    <p>
                        <strong>Attribute:</strong>
                        <span id="card-attribute">-</span>
                    </p>

                    <p>
                        <strong>Level:</strong>
                        <span id="card-level">-</span>
                    </p>

                    <p>
                        <strong>Type:</strong>
                        <span id="card-type">-</span>
                    </p>

                    <p>
                        <strong>ATK:</strong>
                        <span id="card-atk">-</span>
                    </p>

                    <p>
                        <strong>DEF:</strong>
                        <span id="card-def">-</span>
                    </p>

                </div>

                <div class="verification-box" id="verification">
                    <strong>✓ NFC VERIFIED</strong>
                    <p>Authentic SCHACHICUSTOMS card entry</p>
                </div>

            </div>

        </section>

    </main>

    <script src="js/card.js"></script>

</body>

</html>
